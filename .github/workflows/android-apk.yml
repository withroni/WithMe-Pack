name: Android APK

# Builds an installable APK on GitHub's runners, which ship the Android SDK.
# No Expo account, no local Android Studio — push, then download the artifact
# from the run summary.

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the native project
        # `android/` is not committed — Expo regenerates it from app.json, so the
        # config plugins (icons, splash, stripped permissions) always apply.
        run: npx expo prebuild --platform android --no-install

      - name: Raise the Gradle heap
        # prebuild writes 2GB, which the New Architecture build can exhaust on a
        # runner. Later keys win in a properties file, so appending is enough —
        # but the generated file has no trailing newline, so lead with one or
        # this lands on the end of the last property and corrupts it.
        run: printf '\n%s\n' 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' >> android/gradle.properties

      - name: Build release APK
        # Expo's template signs `release` with its bundled debug keystore, so
        # this comes out directly installable. Fine for sideloading and internal
        # testing; a real keystore is required before any Play Store upload.
        #
        # Only the two ARM ABIs are built: no physical phone runs x86, and
        # dropping them roughly halves the build.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: app/android
        env:
          # Optional. Set these repository secrets to build an APK with photo
          # recognition wired up; leave them unset and the app falls back to its
          # built-in demo list. They are inlined into the bundle, so a build
          # carrying them is a test build — see server/README.md.
          EXPO_PUBLIC_SCAN_URL: ${{ secrets.EXPO_PUBLIC_SCAN_URL }}
          EXPO_PUBLIC_SCAN_TOKEN: ${{ secrets.EXPO_PUBLIC_SCAN_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: packit-apk-${{ github.sha }}
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
